<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 268" width="940" height="268" role="img" aria-label="Browser to bridge to tmux pane: the widget posts the selected element to the bridge on port 7331, which maps the dev-server port to its project directory and pastes the prompt into the matching Claude Code tmux pane.">
  <rect width="940" height="268" rx="14" fill="#141414"/>

  <!-- ── 1. browser ─────────────────────────────────────────────── -->
  <text x="28" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a8a8a">YOUR BROWSER</text>
  <rect x="28" y="44" width="256" height="176" rx="10" fill="#1d1d1d" stroke="#2e2e2e"/>
  <rect x="28" y="44" width="256" height="28" rx="10" fill="#232323"/>
  <rect x="28" y="62" width="256" height="10" fill="#232323"/>
  <circle cx="45" cy="58" r="3.5" fill="#3d3d3d"/>
  <circle cx="57" cy="58" r="3.5" fill="#3d3d3d"/>
  <circle cx="69" cy="58" r="3.5" fill="#3d3d3d"/>
  <text x="86" y="62" font-family="ui-monospace, monospace" font-size="11" fill="#8a8a8a">localhost:3000</text>

  <rect x="44" y="88" width="104" height="46" rx="6" fill="#262626"/>
  <rect x="160" y="88" width="108" height="46" rx="6" fill="#262626"/>
  <rect x="44" y="146" width="104" height="56" rx="6" fill="#262626"/>
  <!-- the selected element -->
  <rect x="160" y="146" width="108" height="56" rx="6" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-width="2"/>
  <text x="214" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#f5b78f">&lt;ProfileCard&gt;</text>

  <text x="28" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#c9c9c9">Click what&#8217;s wrong. Type or dictate the fix.</text>

  <!-- ── arrow 1 ────────────────────────────────────────────────── -->
  <line x1="296" y1="132" x2="348" y2="132" stroke="#3d3d3d" stroke-width="1.5"/>
  <path d="M348 132 l-7 -4 v8 z" fill="#3d3d3d"/>
  <text x="322" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#777">POST</text>
  <text x="322" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#777">/send</text>

  <!-- ── 2. bridge ──────────────────────────────────────────────── -->
  <text x="362" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a8a8a">BRIDGE :7331</text>
  <rect x="362" y="44" width="216" height="176" rx="10" fill="#1d1d1d" stroke="#2e2e2e"/>

  <text x="382" y="76" font-family="ui-monospace, monospace" font-size="11.5" fill="#f5f5f5">:3000</text>
  <text x="382" y="100" font-family="ui-monospace, monospace" font-size="11.5" fill="#8a8a8a">↓ lsof</text>
  <text x="382" y="124" font-family="ui-monospace, monospace" font-size="11.5" fill="#f5f5f5">~/code/acme</text>
  <text x="382" y="148" font-family="ui-monospace, monospace" font-size="11.5" fill="#8a8a8a">↓ deepest match</text>
  <text x="382" y="172" font-family="ui-monospace, monospace" font-size="11.5" fill="#6ee7a8">pane %44</text>
  <line x1="382" y1="188" x2="558" y2="188" stroke="#2a2a2a"/>
  <text x="382" y="206" font-family="system-ui, sans-serif" font-size="10.5" fill="#777">no per-project config</text>

  <!-- ── arrow 2 ────────────────────────────────────────────────── -->
  <line x1="590" y1="132" x2="636" y2="132" stroke="#3d3d3d" stroke-width="1.5"/>
  <path d="M636 132 l-7 -4 v8 z" fill="#3d3d3d"/>
  <text x="613" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#777">paste</text>
  <text x="613" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#777">buffer</text>

  <!-- ── 3. tmux ────────────────────────────────────────────────── -->
  <text x="650" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a8a8a">TMUX PANE YOU ALREADY HAVE OPEN</text>
  <rect x="650" y="44" width="274" height="176" rx="10" fill="#1d1d1d" stroke="#2e2e2e"/>
  <rect x="650" y="44" width="274" height="24" rx="10" fill="#232323"/>
  <rect x="650" y="58" width="274" height="10" fill="#232323"/>
  <text x="664" y="61" font-family="ui-monospace, monospace" font-size="10" fill="#8a8a8a">digiin:1 · ~/code/acme</text>

  <text x="664" y="90" font-family="ui-monospace, monospace" font-size="10" fill="#d97757">&gt; UI change request from the browser</text>
  <text x="664" y="110" font-family="ui-monospace, monospace" font-size="10" fill="#c9c9c9">&#160;&#160;&lt;ProfileCard&gt;</text>
  <text x="664" y="128" font-family="ui-monospace, monospace" font-size="10" fill="#8a8a8a">&#160;&#160;ProfileCard › ProfileGrid › AppShell</text>
  <text x="664" y="146" font-family="ui-monospace, monospace" font-size="10" fill="#8a8a8a">&#160;&#160;props, styles, box, screenshot</text>
  <text x="664" y="172" font-family="ui-monospace, monospace" font-size="10" fill="#6ee7a8">&#160;&#160;⏺ Enlarging the avatar…</text>

  <text x="924" y="240" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#c9c9c9">The session that already has your context loaded.</text>
</svg>
